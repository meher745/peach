[package]
name = "solution"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
hashbrown = "0.17.1"
memchr = "2.8.3"
memmap2 = "0.9.12"
mimalloc = "0.1.52"
parquet = { version = "60.1.0", default-features = false, features = ["arrow"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.profiling]
inherits = "release"
debug = true
